<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <title>1selector_tagidclass</title>
    <style>
        /* *{color: aquamarine;}
        h1{color: brown;} 
        p{color: aqua;}

        h1, p{color: chartreuse;} */

        #header{
            width: 800px; margin: 0 auto;
            background: red;
        }
        #wrap{
            width: 800px; margin: 0 auto;
            overflow: hidden;
        }
        #aside{
            width: 200px; float: left;
            background: blue;
        }
        #content{
            width: 600px; float: left;
            background-color: green;
        }
        #rint{color: red;}

        /*.select{color: yellowgreen}*/
        li.select{color: aqua;}

       /* class="item header"*/
       .item{color: red;}
       .header{color: blue;}
       
    </style>
</head>
<body>
    <!--id속성을 중복 사용하면 해당 id송성을 표기한 모든 태그에 할당됨
    하지만, 문제 발생 소지 있음.id="rint" //여러개 있을때는 class사용-->
    <h2 >1.전제 선택자</h2>
    <h2 >2.태그 선택자</h2>
    <h2 >3.아이디 선택자</h2>
    <h2>4.클래스 선택자</h2>
    <hr>

    <h1 class="item header">동해물과 백두산이</h1>
    <hr>
    <ul>
        <li>사과</li>
        <li class="select">바나나</li>
        <li>오렌지</li>
        <li>감</li>
    </ul>
    <hr>
    <div id="header">
        <h1>#header 태그</h1>
    </div>
    <div id="wrap">
        <div id="aside">
            <h1>#aside 태그</h1>
        </div>
        <div id="content">
            <h1>#content 태그</h1>
        </div>
    </div>
    

    <hr>
    <h1>제목 글자</h1>
    <p>Lorem ipsum dolor sit amet</p>
    <p>consectetur adipisicing elit.</p>
    
</body>
</html>
