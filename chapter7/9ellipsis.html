<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <title>9ellipsis</title>
    <style>
        /* 초기화 */
* { margin: 0; padding: 0; }

/* 주제 */
body { background: red; }

#container {
    /* 색상 및 크기 적용 */
    width: 500px; height: 250px;
    background: orange;

    /* 위치 설정 */
    position: absolute;
    left: 50%; top: 50%;
    margin-left: -250px;
    margin-top: -125px;
}
    </style>
    
</head>

<body>
    <h2>ch7_3글자 생략</h2>
    <h3>ch7_3글자 생략...너비를 넘어가는 글자 생략</h3>
    <hr>

    <h1 class="ellipsis">Lorem ipsum dolor sit amet, consectetur adipiscing elit. </h1>
    <p class="ellipsis">Lorem ipsum dolor sit amet, consectetur adipiscing elit. </p>
</body>

</html>
