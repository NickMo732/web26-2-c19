<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    
    <script>
        // 불 표현식이 참이면 중괄호 안 문장을 실행
        if (273 < 52) {
            alert('273 < 52 => true');
        }
        if (273 > 52) {
            alert('273 > 52 => true');
        }
        alert('프로그램 종료');
    </script>
</head>
<body>
    if조건문으로 참과 거짓 판별 <hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
 
</body>
</html>
