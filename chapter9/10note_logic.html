<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    
    <script>
        // const 키워드: 값을 바꿀 수 없는 상수 선언
        const date = new Date();
        const month = date.getMonth() + 1;

        // 논리 연산자(&&, ||)를 사용한 조건문
        if (3 <= month && month <= 5) {
            alert('봄입니다.');
        } else if (6 <= month && month <= 8) {
            alert('여름입니다.');
        } else if (9 <= month && month <= 11) {
            alert('가을입니다.');
        } else {
            alert('겨울입니다.');
        }
    </script>
</head>

<body>
    const 키워드<hr>
    
    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>

</html>
