<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    
    <script>
        // 배열 생성
        let array = ['가', '나', '다', '라'];

        // 배열 요소 변경 (인덱스는 0부터 시작)
        array[0] = '윤';

        // 배열 요소 출력
        alert(array[0]);
        alert(array[1]);
        alert(array[2]);
        alert(array[3]);
    </script>
</head>

<body>
    배열 생성과 배열 요소 접근<hr>

    <h3>3. 조건문과 반복문</h3>
    <h5>    1_조건문</h5>
    <h5>    2_반복문</h5>
</body>

</html>
