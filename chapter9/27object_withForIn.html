<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        let product = {
            제품명: '7D 건조 망고',
            유형: '당절임',
            성분: '망고, 설탕, 메타중아황산나트륨, 치자황색소',
            원산지: '필리핀'
        };

        // for in 반복문으로 객체의 키를 하나씩 꺼냄
        let output = '';
        for (let key in product) {
            output += '●' + key + ': ' + product[key] + '\n';
        }

        alert(output);
    </script>
</head>
<body>
    <h2>객체의 개요 </h2> 
    -for in반복문을 작성해 객체를 순환.<hr>

    <h3>5. 객체</h3>
    <h5>    1_객체의 개요</h5>
    <h5>    2_객체의 속성과 메서드</h5>    

    
    
</body>
</html>
