<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        // 익명 함수와 선언적 함수를 같은 이름으로 선언
        // (let과 선언적 함수는 같은 이름을 쓸 수 없어서 var 사용)
        var 함수 = function () { alert('익명 함수입니다.'); };
        function 함수() { alert('선언적 함수입니다.'); }

        // 선언적 함수를 먼저 읽고, 나중에 읽은 익명 함수가 덮어씀
        // → '익명 함수입니다.' 출력
        함수();
    </script>
</head>
<body>
    <h2><b>[선언적 함수와 익명함수를 함께 사용할 때]</b> 실행 우선순위: </h2>
    <ul>
        <li>- js는 모든 코드를 읽기 전에 선언적 함수를 먼저 읽음.</li>
        <li>- 따라서 선언적 함수가 익명 함수 뒤에 있지만 먼저 읽기때문에, 나중에 읽은 익명함수를 실행함.</li>
    </ul>
     <hr>

    <h3>4. 함수 </h3>
    <h5>    1_선언과 호출, 실행 우선순위</h5>
    <h6>    1.1_익명 함수 선언하기</h6>
    <h6>    1.2_선언적 함수 선언하기</h6>
    <h5>    2_매개변수와 반환 값</h5>
    <h5>    3_콜백 함수</h5>
    
</body>
</html>
