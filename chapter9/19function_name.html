<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        // 선언적 함수 선언: function 키워드 뒤에 함수 이름 입력
        function 함수() {
            alert('함수_첫 번째 줄');
            alert('함수_두 번째 줄');
        }

        // 함수 호출
        함수();

        alert(typeof (함수) + ' : ' + 함수);
    </script>
</head>
<body>
    선언적 함수 선언하기: 함수 이름을 입력해서 만듦<hr>

    <h3>4. 함수 </h3>
    <h5>    1_선언과 호출, 실행 우선순위</h5>
    <h6>    1.1_익명 함수 선언하기</h6>
    <h6>    1.2_선언적 함수 선언하기</h6>
    <h5>    2_매개변수와 반환 값</h5>
    <h5>    3_콜백 함수</h5>
    
</body>
</html>
