<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Basic</title>
    <script>
        // 객체 선언: 중괄호 안에 '키: 값' 형태로 입력
        let product = {
            제품명: '7D 건조 망고',
            유형: '당절임',
            성분: '망고, 설탕, 메타중아황산나트륨, 치자황색소',
            원산지: '필리핀'
        };

        // 객체 요소 접근: 대괄호 또는 점(.) 사용
        alert(product['제품명']);
        alert(product['유형']);
        alert(product.성분);
        alert(product.원산지);
    </script>
</head>
<body>
    <h2>객체: 자료형 여러개를 한번에 저장합니다. </h2> 
    -<b>배열</b>은 인덱스를 기반으로 자료를 저장하지만, <br>
     <b>객체</b>는 키를 기반으로 자료를 저장합니다.<hr>

    <h3>5. 객체</h3>
    <h5>    1_객체의 개요</h5>
    <h5>    2_객체의 속성과 메서드</h5>
</body>
</html>
